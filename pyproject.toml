[project]
name = "options-builder"
version = "0.1.0"
description = "Options pricing engine with Black-Scholes and Greeks calculations"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
