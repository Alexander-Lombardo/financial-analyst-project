<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SEC Filing Browser{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-brand">SEC Filing Browser</a>
            <div class="nav-search">
                <form action="{{ url_for('index') }}" method="get" id="nav-search-form">
                    <input type="text"
                           name="q"
                           placeholder="Search company or ticker..."
                           class="nav-search-input"
                           autocomplete="off">
                </form>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>Data provided by <a href="https://www.sec.gov/edgar" target="_blank">SEC EDGAR</a></p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
